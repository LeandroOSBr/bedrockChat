name: "DevSecOps GenAI Pipeline (Terraform & Bedrock Guardrails)"

on:
  push:
    branches:
      - main
      - master
    paths:
      - "deploy/terraform/**"
      - "bedrockChatFunction.py"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "deploy/terraform/**"
      - "bedrockChatFunction.py"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Ação a executar"
        required: true
        default: "apply"
        type: choice
        options:
          - "apply"
          - "plan-only"
          - "destroy"
          - "red-team-only"
      enable_guardrails:
        description: "Habilitar AWS Bedrock Guardrail (LAB 03)"
        required: true
        default: true
        type: boolean
      enable_observability:
        description: "Habilitar Observabilidade X-Ray e Bedrock Logging (LAB 05)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # ============================================================================
  # JOB 1: Linting e Validação Estática (Shift-Left IaC)
  # ============================================================================
  lint-and-validate:
    name: "1. Linting & Validação Estática"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar Sintaxe dos Scripts Python
        run: |
          python -m py_compile bedrockChatFunction.py
          python -m py_compile deploy/terraform/tests/test_lab02_owasp_redteam.py
          echo "✔ Sintaxe Python validada com sucesso."

      - name: Configurar Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Checagem de Formatação (terraform fmt)
        run: |
          terraform -chdir=deploy/terraform fmt -check

      - name: Inicialização Local (Sem Backend)
        run: |
          terraform -chdir=deploy/terraform init -backend=false

      - name: Validação do Schema e Sintaxe HCL (terraform validate)
        run: |
          terraform -chdir=deploy/terraform validate

  # ============================================================================
  # JOB 2: Planejamento de Infraestrutura (Terraform Plan)
  # ============================================================================
  terraform-plan:
    name: "2. Terraform Plan (Geração do Plano)"
    runs-on: ubuntu-latest
    needs: lint-and-validate
    if: ${{ github.event_name != 'workflow_dispatch' || (github.event.inputs.action != 'destroy' && github.event.inputs.action != 'red-team-only') }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12 (para empacotamento Lambda)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar Presença das Secrets AWS no GitHub
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$SECRET_KEY" ]; then
            echo "::error title=Secrets AWS Ausentes::As Secrets 'AWS_ACCESS_KEY_ID' ou 'AWS_SECRET_ACCESS_KEY' não foram configuradas nas configurações do repositório."
            echo "Acesse https://github.com/${{ github.repository }}/settings/secrets/actions e adicione as secrets."
            exit 1
          fi

          if [[ "$KEY_ID" == *"/"* ]]; then
            echo "::error title=Chaves Invertidas::A secret 'AWS_ACCESS_KEY_ID' contém uma barra ('/'). Você colou a Secret Access Key no lugar do Access Key ID!"
            exit 1
          fi

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Configurar Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: |
          terraform -chdir=deploy/terraform init

      - name: Executar Terraform Plan
        id: plan
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FLAGS="-var=enable_guardrails=${{ github.event.inputs.enable_guardrails }} -var=enable_observability=${{ github.event.inputs.enable_observability }}"
          fi

          terraform -chdir=deploy/terraform plan -out=tfplan $FLAGS -no-color | tee plan_output.txt
          
          PLAN_SUMMARY=$(grep -E 'Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy' plan_output.txt || echo "Nenhuma alteração estrutural.")
          
          echo "### 📋 Relatório do Terraform Plan" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** \`$PLAN_SUMMARY\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!IMPORTANT]" >> $GITHUB_STEP_SUMMARY
          echo "> O plano de infraestrutura foi gerado com sucesso! A etapa de **Apply** exigirá aprovação manual no ambiente **production** antes de efetivar quaisquer mudanças na AWS." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Adicionar tabela de outputs do estado atual (se houver infraestrutura já gerenciada)
          if terraform -chdir=deploy/terraform output -json > outputs.json 2>/dev/null && [ $(jq 'keys | length' outputs.json) -gt 0 ]; then
            echo "#### 🌐 Outputs da Infraestrutura (State Remoto):" >> $GITHUB_STEP_SUMMARY
            echo "| Recurso | Identificador / URL | Descrição |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

            S3_URL=$(jq -r '.s3_website_url.value // empty' outputs.json)
            API_URL=$(jq -r '.api_chat_endpoint.value // empty' outputs.json)
            GW_URL=$(jq -r '.api_gateway_url.value // empty' outputs.json)
            GUARD_ID=$(jq -r '.guardrail_id.value // empty' outputs.json)
            GUARD_VER=$(jq -r '.guardrail_version.value // empty' outputs.json)
            LAMBDA_NAME=$(jq -r '.lambda_function_name.value // empty' outputs.json)
            FRONT_BUCKET=$(jq -r '.frontend_bucket_name.value // empty' outputs.json)
            RAG_BUCKET=$(jq -r '.rag_bucket_name.value // empty' outputs.json)
            CW_LOG=$(jq -r '.cloudwatch_log_group_invocations.value // empty' outputs.json)

            [ -n "$S3_URL" ] && echo "| 🌐 **Frontend Web (chat.html)** | [$S3_URL]($S3_URL) | Interface gráfica para testes |" >> $GITHUB_STEP_SUMMARY
            [ -n "$API_URL" ] && echo "| ⚡ **API Chat Endpoint** | \`$API_URL\` | Endpoint POST utilizado pelo chat |" >> $GITHUB_STEP_SUMMARY
            [ -n "$GW_URL" ] && echo "| 🔗 **API Gateway Base** | \`$GW_URL\` | URL base do HTTP API Gateway |" >> $GITHUB_STEP_SUMMARY
            [ -n "$GUARD_ID" ] && echo "| 🛡️ **Bedrock Guardrail** | \`$GUARD_ID\` (v$GUARD_VER) | Identificador da política ativa |" >> $GITHUB_STEP_SUMMARY
            [ -n "$LAMBDA_NAME" ] && echo "| ⚙️ **Lambda Function** | \`$LAMBDA_NAME\` | Função de backend serverless |" >> $GITHUB_STEP_SUMMARY
            [ -n "$FRONT_BUCKET" ] && echo "| 🪣 **Frontend Bucket S3** | \`$FRONT_BUCKET\` | Hospedagem estática |" >> $GITHUB_STEP_SUMMARY
            [ -n "$RAG_BUCKET" ] && echo "| 📚 **RAG Bucket S3** | \`$RAG_BUCKET\` | Base de conhecimento RAG |" >> $GITHUB_STEP_SUMMARY
            [ -n "$CW_LOG" ] && echo "| 📋 **CloudWatch Log Group** | \`$CW_LOG\` | Auditoria de logs Bedrock |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "<details><summary>🔍 Clique para expandir o Terraform Plan detalhado</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          cat plan_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Salvar Artefatos do Plano (tfplan e zip)
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-artifact
          path: |
            deploy/terraform/tfplan
            deploy/terraform/bedrockChatFunction.zip
          retention-days: 2

  # ============================================================================
  # JOB 3: Aplicação de Infraestrutura (Terraform Apply) com GATE DE APROVAÇÃO
  # ============================================================================
  terraform-apply:
    name: "3. Terraform Apply (Requer Aprovação Manual)"
    runs-on: ubuntu-latest
    needs: terraform-plan
    # O uso do environment 'production' ativa a aprovação manual nativa do GitHub Actions
    environment: production
    if: |
      github.event_name != 'pull_request' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'))
    outputs:
      api_chat_endpoint: ${{ steps.export-output.outputs.api_chat_endpoint }}
      s3_website_url: ${{ steps.export-output.outputs.s3_website_url }}
      guardrail_id: ${{ steps.export-output.outputs.guardrail_id }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Baixar Artefatos do Plano
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-artifact
          path: deploy/terraform

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Configurar Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: |
          terraform -chdir=deploy/terraform init

      - name: Terraform Apply (Executando o Plano Aprovado)
        run: |
          terraform -chdir=deploy/terraform apply -auto-approve tfplan

      - name: Exportar Outputs da Infraestrutura
        id: export-output
        run: |
          terraform -chdir=deploy/terraform output -json > apply_outputs.json
          
          API_URL=$(jq -r '.api_chat_endpoint.value // empty' apply_outputs.json)
          S3_URL=$(jq -r '.s3_website_url.value // empty' apply_outputs.json)
          GW_URL=$(jq -r '.api_gateway_url.value // empty' apply_outputs.json)
          GUARD_ID=$(jq -r '.guardrail_id.value // empty' apply_outputs.json)
          GUARD_VER=$(jq -r '.guardrail_version.value // empty' apply_outputs.json)
          LAMBDA_NAME=$(jq -r '.lambda_function_name.value // empty' apply_outputs.json)
          FRONT_BUCKET=$(jq -r '.frontend_bucket_name.value // empty' apply_outputs.json)
          RAG_BUCKET=$(jq -r '.rag_bucket_name.value // empty' apply_outputs.json)
          CW_LOG=$(jq -r '.cloudwatch_log_group_invocations.value // empty' apply_outputs.json)

          echo "api_chat_endpoint=$API_URL" >> $GITHUB_OUTPUT
          echo "s3_website_url=$S3_URL" >> $GITHUB_OUTPUT
          echo "guardrail_id=$GUARD_ID" >> $GITHUB_OUTPUT

          echo "### 🚀 Relatório de Outputs do Terraform Apply" >> $GITHUB_STEP_SUMMARY
          echo "Todos os recursos foram provisionados e consolidados com sucesso na AWS:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Recurso | Identificador / URL | Descrição |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 **Frontend Web (chat.html)** | [$S3_URL]($S3_URL) | Interface gráfica para testes |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚡ **API Chat Endpoint** | \`$API_URL\` | Endpoint POST utilizado pelo chat |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 **API Gateway Base** | \`$GW_URL\` | URL base do HTTP API Gateway |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ **Bedrock Guardrail** | \`$GUARD_ID\` (v$GUARD_VER) | Identificador da política ativa |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚙️ **Lambda Function** | \`$LAMBDA_NAME\` | Função de backend serverless |" >> $GITHUB_STEP_SUMMARY
          echo "| 🪣 **Frontend Bucket S3** | \`$FRONT_BUCKET\` | Hospedagem estática |" >> $GITHUB_STEP_SUMMARY
          echo "| 📚 **RAG Bucket S3** | \`$RAG_BUCKET\` | Base de conhecimento RAG |" >> $GITHUB_STEP_SUMMARY
          echo "| 📋 **CloudWatch Log Group** | \`$CW_LOG\` | Auditoria de logs Bedrock |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!TIP]" >> $GITHUB_STEP_SUMMARY
          echo "> Para acessar a aplicação, clique no link do **Frontend Web** acima. O chat já vem pré-configurado para conectar ao endpoint da API e ao Guardrail recém-provisionados." >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB 4: Security Gate com Red Teaming Automatizado
  # ============================================================================
  security-gate-redteam:
    name: "4. Security Gate (OWASP Red Teaming)"
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: |
      always() && 
      needs.terraform-apply.result == 'success'

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar Suíte de Testes Ofensivos OWASP Top 10 (LAB 02)
        run: |
          API_URL="${{ needs.terraform-apply.outputs.api_chat_endpoint }}"
          echo "Disparando testes de segurança contra: $API_URL"
          python deploy/terraform/tests/test_lab02_owasp_redteam.py --url "$API_URL" --fail-on-vuln

  # ============================================================================
  # JOB 5: Teardown sob Demanda (Terraform Destroy) com GATE DE APROVAÇÃO
  # ============================================================================
  terraform-destroy:
    name: "Teardown (Terraform Destroy - Requer Aprovação)"
    runs-on: ubuntu-latest
    needs: lint-and-validate
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' }}
    environment: production

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Configurar Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: |
          terraform -chdir=deploy/terraform init

      - name: Executar Terraform Destroy
        run: |
          terraform -chdir=deploy/terraform destroy -auto-approve
          echo "### 🧹 Todos os recursos foram destruídos com sucesso na AWS!" >> $GITHUB_STEP_SUMMARY
