name: "DevSecOps GenAI Pipeline (Terraform & Bedrock Guardrails)"

on:
  push:
    branches:
      - main
      - master
    paths:
      - "deploy/terraform/**"
      - "bedrockChatFunction.py"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "deploy/terraform/**"
      - "bedrockChatFunction.py"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      action:
        description: "Ação a executar"
        required: true
        default: "apply"
        type: choice
        options:
          - "apply"
          - "plan-only"
          - "destroy"
          - "red-team-only"
      enable_guardrails:
        description: "Habilitar AWS Bedrock Guardrail (LAB 03)"
        required: true
        default: true
        type: boolean
      enable_observability:
        description: "Habilitar Observabilidade X-Ray e Bedrock Logging (LAB 05)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # ============================================================================
  # JOB 1: Linting e Validação Estática (Shift-Left IaC)
  # ============================================================================
  lint-and-validate:
    name: "1. Linting & Validação Estática"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar Sintaxe dos Scripts Python
        run: |
          python -m py_compile bedrockChatFunction.py
          python -m py_compile deploy/terraform/tests/test_lab02_owasp_redteam.py
          echo "✔ Sintaxe Python validada com sucesso."

      - name: Configurar Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Checagem de Formatação (terraform fmt)
        run: |
          terraform -chdir=deploy/terraform fmt -check

      - name: Inicialização Local (Sem Backend)
        run: |
          terraform -chdir=deploy/terraform init -backend=false

      - name: Validação do Schema e Sintaxe HCL (terraform validate)
        run: |
          terraform -chdir=deploy/terraform validate

  # ============================================================================
  # JOB 2: Planejamento de Infraestrutura (Terraform Plan)
  # ============================================================================
  terraform-plan:
    name: "2. Terraform Plan (Geração do Plano)"
    runs-on: ubuntu-latest
    needs: lint-and-validate
    if: ${{ github.event_name != 'workflow_dispatch' || (github.event.inputs.action != 'destroy' && github.event.inputs.action != 'red-team-only') }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12 (para empacotamento Lambda)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar Presença das Secrets AWS no GitHub
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$SECRET_KEY" ]; then
            echo "::error title=Secrets AWS Ausentes::As Secrets 'AWS_ACCESS_KEY_ID' ou 'AWS_SECRET_ACCESS_KEY' não foram configuradas nas configurações do repositório."
            echo "Acesse https://github.com/${{ github.repository }}/settings/secrets/actions e adicione as secrets."
            exit 1
          fi

          if [[ "$KEY_ID" == *"/"* ]]; then
            echo "::error title=Chaves Invertidas::A secret 'AWS_ACCESS_KEY_ID' contém uma barra ('/'). Você colou a Secret Access Key no lugar do Access Key ID!"
            exit 1
          fi

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Configurar Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: |
          terraform -chdir=deploy/terraform init

      - name: Executar Terraform Plan
        id: plan
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FLAGS="-var=enable_guardrails=${{ github.event.inputs.enable_guardrails }} -var=enable_observability=${{ github.event.inputs.enable_observability }}"
          fi

          terraform -chdir=deploy/terraform plan -out=tfplan $FLAGS -no-color | tee plan_output.txt
          
          PLAN_SUMMARY=$(grep -E 'Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy' plan_output.txt || echo "Nenhuma alteração estrutural.")
          
          echo "### 📋 Relatório do Terraform Plan" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** \`$PLAN_SUMMARY\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!IMPORTANT]" >> $GITHUB_STEP_SUMMARY
          echo "> O plano de infraestrutura foi gerado com sucesso! A etapa de **Apply** exigirá aprovação manual no ambiente **production** antes de efetivar quaisquer mudanças na AWS." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>🔍 Clique para expandir o Terraform Plan detalhado</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```terraform' >> $GITHUB_STEP_SUMMARY
          cat plan_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Salvar Artefatos do Plano (tfplan e zip)
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-artifact
          path: |
            deploy/terraform/tfplan
            deploy/terraform/bedrockChatFunction.zip
          retention-days: 2

  # ============================================================================
  # JOB 3: Aplicação de Infraestrutura (Terraform Apply) com GATE DE APROVAÇÃO
  # ============================================================================
  terraform-apply:
    name: "3. Terraform Apply (Requer Aprovação Manual)"
    runs-on: ubuntu-latest
    needs: terraform-plan
    # O uso do environment 'production' ativa a aprovação manual nativa do GitHub Actions
    environment: production
    if: |
      github.event_name != 'pull_request' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'))
    outputs:
      api_chat_endpoint: ${{ steps.export-output.outputs.api_chat_endpoint }}
      s3_website_url: ${{ steps.export-output.outputs.s3_website_url }}
      guardrail_id: ${{ steps.export-output.outputs.guardrail_id }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Baixar Artefatos do Plano
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-artifact
          path: deploy/terraform

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Configurar Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: |
          terraform -chdir=deploy/terraform init

      - name: Terraform Apply (Executando o Plano Aprovado)
        run: |
          terraform -chdir=deploy/terraform apply -auto-approve tfplan

      - name: Exportar Outputs da Infraestrutura
        id: export-output
        run: |
          API_URL=$(terraform -chdir=deploy/terraform output -raw api_chat_endpoint)
          S3_URL=$(terraform -chdir=deploy/terraform output -raw s3_website_url)
          GUARDRAIL_ID=$(terraform -chdir=deploy/terraform output -raw guardrail_id)
          echo "api_chat_endpoint=$API_URL" >> $GITHUB_OUTPUT
          echo "s3_website_url=$S3_URL" >> $GITHUB_OUTPUT
          echo "guardrail_id=$GUARDRAIL_ID" >> $GITHUB_OUTPUT

          echo "### 🚀 Infraestrutura Provisionada com Sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "- **API Chat Endpoint:** \`$API_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Web Frontend:** $S3_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Bedrock Guardrail ID:** \`$GUARDRAIL_ID\`" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # JOB 4: Security Gate com Red Teaming Automatizado
  # ============================================================================
  security-gate-redteam:
    name: "4. Security Gate (OWASP Red Teaming)"
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: |
      always() && 
      needs.terraform-apply.result == 'success'

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar Suíte de Testes Ofensivos OWASP Top 10 (LAB 02)
        run: |
          API_URL="${{ needs.terraform-apply.outputs.api_chat_endpoint }}"
          echo "Disparando testes de segurança contra: $API_URL"
          python deploy/terraform/tests/test_lab02_owasp_redteam.py --url "$API_URL" --fail-on-vuln

  # ============================================================================
  # JOB 5: Teardown sob Demanda (Terraform Destroy) com GATE DE APROVAÇÃO
  # ============================================================================
  terraform-destroy:
    name: "Teardown (Terraform Destroy - Requer Aprovação)"
    runs-on: ubuntu-latest
    needs: lint-and-validate
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' }}
    environment: production

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Configurar Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: |
          terraform -chdir=deploy/terraform init

      - name: Executar Terraform Destroy
        run: |
          terraform -chdir=deploy/terraform destroy -auto-approve
          echo "### 🧹 Todos os recursos foram destruídos com sucesso na AWS!" >> $GITHUB_STEP_SUMMARY
